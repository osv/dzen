name: Build and Run Integration Tests

on:
  push:
    branches:
      - '**'  # Run on all branches
  # pull_request:
  #   branches:
  #     - '**'  # Run on all pull requests

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore APT Cache
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: |
            imagemagick
            autoconf
            automake
            libtool
            pkg-config
            libx11-dev
            libxft-dev
            libxpm-dev
            libxcursor-dev
            libxinerama-dev
            libxrandr-dev
            fonts-dejavu-core
            fontconfig
            xfonts-base
            xdotool
            x11-apps
            x11-utils
            x11-xserver-utils
            xvfb
            xserver-xephyr
            xserver-xorg-core
            xserver-xorg-video-dummy
            x11-xkb-utils
            xkb-data
            clang-format
          version: 5

      # Fix ImageMagick symlinks (cache-apt-pkgs-action doesn't preserve alternatives)
      - name: Fix ImageMagick alternatives
        run: |
          sudo update-alternatives --install /usr/bin/compare compare /usr/bin/compare-im6.q16 100
          sudo update-alternatives --install /usr/bin/convert convert /usr/bin/convert-im6.q16 100
          sudo update-alternatives --install /usr/bin/import import /usr/bin/import-im6.q16 100

      # Check code formatting
      - name: Check code formatting
        run: |
          find . -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror

      # Generate the configure script
      - name: Generate configure script
        run: autoreconf -vif

      # Run configure
      - name: Configure the project
        run: ./configure --enable-gadgets --enable-xft --enable-xpm --enable-xinerama --enable-xcursor --enable-xrandr

      # Build the app using Makefile
      - name: Build the application
        run: |
          make

      # Run E2E tests using native mode (Xvfb already set up by GitHub Actions)
      - name: Run E2E tests
        run: |
          # Start Xvfb on display :99
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          # Set the DISPLAY environment variable to use the virtual display
          export DISPLAY=:99
          # waiting for framebuffer
          sleep 4
          fc-list
          # run tests using --native since we manage Xvfb externally
          make test

      # Run Xinerama-specific tests
      - name: Run Xinerama tests
        run: |
          export DISPLAY=:99
          make test-xinerama

      # Run XRandR tests on an isolated Xorg dummy display. Missing test tools
      # or the dummy DDX are errors by default, so this step cannot silently skip.
      - name: Run XRandR integration tests
        run: make test-xrandr

      # Test without XFT support
      - name: Configure and build without XFT
        run: |
          make distclean
          ./configure --disable-xft --enable-xpm --enable-xinerama --enable-xcursor --enable-xrandr
          make

      - name: Run non-XFT tests
        run: |
          export DISPLAY=:99
          make test-nonxft

      - name: Compile with XRandR and without Xinerama
        run: |
          make distclean
          ./configure --enable-xrandr --disable-xinerama --disable-xcursor --disable-xpm
          make

      - name: Compile without XRandR
        run: |
          make distclean
          ./configure --disable-xrandr --enable-xinerama --enable-xcursor --enable-xpm
          make

      # Upload screenshots and diffs as artifacts if ANY test fails
      # This must be at the END of the workflow to catch all failures
      - name: Upload screenshots as artifacts (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-artifacts
          path: integration-tests
